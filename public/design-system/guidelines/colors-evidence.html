<!-- @dsCard group="Colors" viewport="700x120" subtitle="The only status colors — shape plus fill, never color alone" name="Evidence states" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Evidence states</title><link rel="stylesheet" href="../styles.css"><style>body{padding:16px 20px;font-family:var(--font-sans)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sw{display:grid;gap:4px;font-size:11px;color:var(--text-muted)}.sw i{display:block;width:88px;height:52px;border-radius:var(--radius-md);border:1px solid var(--border)}.sw b{font-weight:600;color:var(--text);font-size:11px}.k{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}</style></head><body><div class="row" style="gap:8px">
<span style="display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 9px;border-radius:var(--radius-pill);background:var(--ev-observed-bg);color:var(--ev-observed-fg)">● Observed</span>
<span style="display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 9px;border-radius:var(--radius-pill);background:var(--ev-inferred-bg);color:var(--ev-inferred-fg)">◐ Inferred</span>
<span style="display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 9px;border-radius:var(--radius-pill);border:1px dashed var(--ev-limited-border);color:var(--ev-limited-fg)">◔ Limited</span>
<span style="display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 9px;border-radius:var(--radius-pill);border:1px solid var(--ev-unavailable-border);color:var(--ev-unavailable-fg)">○ Unavailable</span>
<span style="display:inline-flex;align-items:center;gap:5px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:var(--radius-pill);background:var(--primary-tint);color:var(--primary-deep)">AI-drafted</span>
<span style="display:inline-flex;align-items:center;gap:5px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:var(--radius-pill);border:1px solid var(--grey-300);color:var(--text-body)">Rule-based</span>
<span style="display:inline-flex;font-size:9px;letter-spacing:.08em;text-transform:uppercase;border:1px dashed var(--grey-300);border-radius:var(--radius-pill);padding:1px 6px;color:var(--text-muted)">Planned</span></div>
<p style="margin:12px 0 0;font-size:12px;color:var(--text-muted)">Observed is solid ink. Inferred is the only blue-tinted state (machine judgement). Limited is dashed. Unavailable is hollow. No red, no green.</p></body></html>
