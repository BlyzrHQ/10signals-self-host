<!-- @dsCard group="Spacing" viewport="700x120" subtitle="8 / 10 / 14 / 20 / pill" name="Radii" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Radii</title><link rel="stylesheet" href="../styles.css"><style>body{padding:16px 20px;font-family:var(--font-sans)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sw{display:grid;gap:4px;font-size:11px;color:var(--text-muted)}.sw i{display:block;width:88px;height:52px;border-radius:var(--radius-md);border:1px solid var(--border)}.sw b{font-weight:600;color:var(--text);font-size:11px}.k{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}</style></head><body><div class="row" style="gap:14px"><div class="sw"><i style="width:64px;height:44px;border-radius:var(--radius-sm);background:var(--surface);border:1px solid var(--border-strong)"></i><b>--radius-sm</b><span>8</span></div><div class="sw"><i style="width:64px;height:44px;border-radius:var(--radius-md);background:var(--surface);border:1px solid var(--border-strong)"></i><b>--radius-md</b><span>10</span></div><div class="sw"><i style="width:64px;height:44px;border-radius:var(--radius-lg);background:var(--surface);border:1px solid var(--border-strong)"></i><b>--radius-lg</b><span>14</span></div><div class="sw"><i style="width:64px;height:44px;border-radius:var(--radius-xl);background:var(--surface);border:1px solid var(--border-strong)"></i><b>--radius-xl</b><span>20</span></div><div class="sw"><i style="width:64px;height:44px;border-radius:var(--radius-pill);background:var(--surface);border:1px solid var(--border-strong)"></i><b>--radius-pill</b><span>pill</span></div></div></body></html>
