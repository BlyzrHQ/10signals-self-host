<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Card anatomy</title><link rel="stylesheet" href="../styles.css"><style>body{padding:16px 20px;font-family:var(--font-sans)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sw{display:grid;gap:4px;font-size:11px;color:var(--text-muted)}.sw i{display:block;width:88px;height:52px;border-radius:var(--radius-md);border:1px solid var(--border)}.sw b{font-weight:600;color:var(--text);font-size:11px}.k{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div style="background:var(--surface);border-radius:var(--radius-lg);padding:18px 20px"><p class="k" style="margin:0 0 6px">Surface card</p><p style="margin:0;font-size:14px">Filled --surface, no border, no shadow.</p></div><div style="background:var(--surface-raised);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px"><p class="k" style="margin:0 0 6px">Raised row</p><p style="margin:0;font-size:14px">White on surface, 1px hairline.</p></div></div></body></html>
