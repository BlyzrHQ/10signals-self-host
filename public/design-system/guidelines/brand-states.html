<!-- @dsCard group="Brand" viewport="700x120" subtitle="Hover wash, selected tint, focus ring, disabled" name="Interaction states" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Interaction states</title><link rel="stylesheet" href="../styles.css"><style>body{padding:16px 20px;font-family:var(--font-sans)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sw{display:grid;gap:4px;font-size:11px;color:var(--text-muted)}.sw i{display:block;width:88px;height:52px;border-radius:var(--radius-md);border:1px solid var(--border)}.sw b{font-weight:600;color:var(--text);font-size:11px}.k{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}</style></head><body><div class="row" style="gap:10px"><button style="border:1px solid var(--primary);color:var(--primary);background:transparent;padding:7px 16px;border-radius:var(--radius-pill);font-weight:600;font-size:13px">Default</button><button style="border:1px solid var(--primary);color:var(--primary);background:var(--primary-tint);padding:7px 16px;border-radius:var(--radius-pill);font-weight:600;font-size:13px">Hover</button><button style="border:1px solid var(--primary);color:var(--primary-deep);background:var(--primary-tint);padding:7px 16px;border-radius:var(--radius-pill);font-weight:600;font-size:13px">Selected</button><button style="border:1px solid var(--primary);color:var(--primary);background:transparent;padding:7px 16px;border-radius:var(--radius-pill);font-weight:600;font-size:13px;outline:2px solid var(--primary);outline-offset:2px">Focus</button><button style="border:1px solid var(--primary);color:var(--primary);background:transparent;padding:7px 16px;border-radius:var(--radius-pill);font-weight:600;font-size:13px;opacity:.45">Disabled</button><span style="padding:7px 12px;border-radius:var(--radius-lg);background:var(--hover-wash);font-size:13px">Row hover wash</span></div></body></html>
