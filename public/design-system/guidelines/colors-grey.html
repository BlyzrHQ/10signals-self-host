<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Surfaces & borders</title><link rel="stylesheet" href="../styles.css"><style>body{padding:16px 20px;font-family:var(--font-sans)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sw{display:grid;gap:4px;font-size:11px;color:var(--text-muted)}.sw i{display:block;width:88px;height:52px;border-radius:var(--radius-md);border:1px solid var(--border)}.sw b{font-weight:600;color:var(--text);font-size:11px}.k{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}</style></head><body><div class="row"><div class="sw"><i style="background:var(--white)"></i><b>Page</b><span>--white</span></div><div class="sw"><i style="background:var(--grey-50)"></i><b>Surface</b><span>--grey-50</span></div><div class="sw"><i style="background:var(--grey-100)"></i><b>Border / sunken</b><span>--grey-100</span></div><div class="sw"><i style="background:var(--grey-150)"></i><b>Thumb border</b><span>--grey-150</span></div><div class="sw"><i style="background:var(--grey-200)"></i><b>Control border</b><span>--grey-200</span></div><div class="sw"><i style="background:var(--grey-300)"></i><b>Dashed</b><span>--grey-300</span></div></div></body></html>
