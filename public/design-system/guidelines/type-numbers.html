<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Numbers & prices</title><link rel="stylesheet" href="../styles.css"><style>body{padding:16px 20px;font-family:var(--font-sans)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sw{display:grid;gap:4px;font-size:11px;color:var(--text-muted)}.sw i{display:block;width:88px;height:52px;border-radius:var(--radius-md);border:1px solid var(--border)}.sw b{font-weight:600;color:var(--text);font-size:11px}.k{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}</style></head><body><div class="row" style="gap:28px;align-items:baseline"><span dir="ltr" style="font-size:26px;font-weight:600;font-variant-numeric:tabular-nums">$34.00</span><span dir="ltr" style="font-size:20px;font-weight:600;font-variant-numeric:tabular-nums">91<span style="font-size:12px;color:var(--text-muted)">/100</span></span><span dir="ltr" style="font-size:26px;font-weight:600;font-variant-numeric:tabular-nums">410 <span style="font-size:14px;color:var(--text-muted)">ms</span></span><span style="font-size:13px;color:var(--text-muted);font-style:italic">Not observed</span><span style="font-size:12px;color:var(--text-muted)">never 0, never a bare dash</span></div></body></html>
