<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Data</title><link rel="stylesheet" href="../../styles.css"><style>body{padding:14px 18px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}</style>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script><script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script><script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script><script src="../_card_loader.js"></script></head><body><div id="root"></div>
<script type="text/babel" data-presets="react">loadNS('../', ["actions/Button.jsx","actions/IconButton.jsx","actions/FeedbackThumbs.jsx","labels/EvidencePill.jsx","labels/Tag.jsx","labels/SourceTag.jsx","navigation/Tabs.jsx","navigation/FilterChips.jsx","navigation/NavBar.jsx","forms/Input.jsx","forms/Select.jsx","forms/Segmented.jsx","surfaces/Card.jsx","surfaces/Dialog.jsx","data/DataTable.jsx","data/BenchmarkTrack.jsx","data/ProgressPhases.jsx","data/ProductMatchCard.jsx"]).then(() => {
const { DataTable, BenchmarkTrack, ProgressPhases, ProductMatchCard, EvidencePill, IconButton } = window.NS;
function App(){ const [open,setOpen]=React.useState('m1');
const rows=[{id:'m1',yours:'Cedar & Smoke Soy Candle 8 oz',yp:'$34.00',rival:'Cedarwood Smoke Soy Candle 8 oz',rp:'$29.00',diff:'Rival 14.7% lower',ev:'observed'},{id:'m2',yours:'Fig Tree Reed Diffuser 100 ml',yp:'$42.00',rival:'Black Fig Diffuser 120 ml',rp:'$46.00',diff:'Rival 9.5% lower per ml',ev:'inferred'}];
return <div style={{display:'grid',gap:14}}>
<DataTable minWidth={640} openId={open} columns={[{key:'yours',label:'Your product',width:'minmax(160px,2fr)'},{key:'yp',label:'Your price',width:'80px',render:r=><span dir="ltr" style={{fontVariantNumeric:'tabular-nums'}}>{r.yp}</span>},{key:'rival',label:'Rival product',width:'minmax(160px,2fr)'},{key:'rp',label:'Rival price',width:'80px'},{key:'diff',label:'Price difference',width:'minmax(120px,1fr)'},{key:'ev',label:'Evidence',width:'100px',render:r=><EvidencePill state={r.ev}/>},{key:'x',label:'',width:'32px',render:r=><IconButton label="Why this match?" pressed={open===r.id} onClick={()=>setOpen(open===r.id?null:r.id)}>{open===r.id?'▴':'▾'}</IconButton>}]} rows={rows} renderDrawer={r=><p style={{margin:0,color:'var(--text-body)'}}><b style={{color:'var(--primary)',fontSize:10,letterSpacing:'.08em',textTransform:'uppercase'}}>Why this match?</b> Same wax, size and scent family; both 8 oz soy.</p>}/>
<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
<div><BenchmarkTrack label="Trust readiness" hint="Shipping, returns, contact" yours={60} median={82} leader={95} leaderName="hearthwick.co" status="22 points behind market median" action="Expose clearer public evidence for returns."/><BenchmarkTrack label="Image readiness" hint="Coverage, alt text" yours={92} median={78} leader={92} leaderName="you" status="14 points ahead of market median" action="Proven advantage — keep it."/></div>
<ProgressPhases phases={['Report created','Crawling the company website','Building the catalog','Discovering and verifying competitors','Matching products']} current={2}/>
</div>
<ProductMatchCard product={{name:'Cedar & Smoke Soy Candle 8 oz',sku:'LO-CDR-8',price:'$34.00',summary:'Among observed comparable prices: 2 of 3 · lowest observed $29.00 (hearthwick.co)'}} rivals={[{id:'r1',name:'Cedarwood Smoke Soy Candle 8 oz',domain:'hearthwick.co',price:'$29.00',same:true,diff:'Rival 14.7% lower',basis:'Direct · same size, USD',evidence:'observed',confidence:'92% · high',next:'Review price or make the 60-hour burn time visible',source:'ai'},{id:'r2',name:'Smoked Cedar Candle 8 oz',domain:'emberfield.com',price:'$36.00',diff:'You are 5.6% lower',basis:'Direct · same size, USD',youLower:true,evidence:'observed',confidence:'83% · medium',next:'Hold price'},{id:'r3',name:'Cedar Ember 8 oz',domain:'northlightcandles.com',diff:'Not calculable',basis:'Rival price not observed',evidence:'limited',confidence:'74% · medium',next:'Recheck rival product page',noImage:true}]}/>
</div>; }
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);});</script></body></html>
