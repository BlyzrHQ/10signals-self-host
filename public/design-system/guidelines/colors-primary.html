<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Primary blue</title><link rel="stylesheet" href="../styles.css"><style>body{padding:16px 20px;font-family:var(--font-sans)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sw{display:grid;gap:4px;font-size:11px;color:var(--text-muted)}.sw i{display:block;width:88px;height:52px;border-radius:var(--radius-md);border:1px solid var(--border)}.sw b{font-weight:600;color:var(--text);font-size:11px}.k{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}</style></head><body><div class="row"><div class="sw"><i style="background:var(--blue-50)"></i><b>Tint</b><span>--blue-50</span></div><div class="sw"><i style="background:var(--blue-100)"></i><b>Tint strong</b><span>--blue-100</span></div><div class="sw"><i style="background:var(--blue-500)"></i><b>Primary</b><span>--blue-500</span></div><div class="sw"><i style="background:var(--blue-600)"></i><b>Hover</b><span>--blue-600</span></div><div class="sw"><i style="background:var(--blue-700)"></i><b>Deep text</b><span>--blue-700</span></div></div></body></html>
