<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Spacing scale</title><link rel="stylesheet" href="../styles.css"><style>body{padding:16px 20px;font-family:var(--font-sans)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sw{display:grid;gap:4px;font-size:11px;color:var(--text-muted)}.sw i{display:block;width:88px;height:52px;border-radius:var(--radius-md);border:1px solid var(--border)}.sw b{font-weight:600;color:var(--text);font-size:11px}.k{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}</style></head><body><div class="row" style="align-items:flex-end;gap:14px"><div class="sw" style="justify-items:center"><i style="width:var(--space-1);height:var(--space-1);border-radius:2px;background:var(--primary);border:0"></i><b>1</b></div><div class="sw" style="justify-items:center"><i style="width:var(--space-2);height:var(--space-2);border-radius:2px;background:var(--primary);border:0"></i><b>2</b></div><div class="sw" style="justify-items:center"><i style="width:var(--space-3);height:var(--space-3);border-radius:2px;background:var(--primary);border:0"></i><b>3</b></div><div class="sw" style="justify-items:center"><i style="width:var(--space-4);height:var(--space-4);border-radius:2px;background:var(--primary);border:0"></i><b>4</b></div><div class="sw" style="justify-items:center"><i style="width:var(--space-5);height:var(--space-5);border-radius:2px;background:var(--primary);border:0"></i><b>5</b></div><div class="sw" style="justify-items:center"><i style="width:var(--space-6);height:var(--space-6);border-radius:2px;background:var(--primary);border:0"></i><b>6</b></div><div class="sw" style="justify-items:center"><i style="width:var(--space-7);height:var(--space-7);border-radius:2px;background:var(--primary);border:0"></i><b>7</b></div><div class="sw" style="justify-items:center"><i style="width:var(--space-8);height:var(--space-8);border-radius:2px;background:var(--primary);border:0"></i><b>8</b></div><div class="sw" style="justify-items:center"><i style="width:var(--space-9);height:var(--space-9);border-radius:2px;background:var(--primary);border:0"></i><b>9</b></div><div class="sw" style="justify-items:center"><i style="width:var(--space-10);height:var(--space-10);border-radius:2px;background:var(--primary);border:0"></i><b>10</b></div><div class="sw" style="justify-items:center"><i style="width:var(--space-12);height:var(--space-12);border-radius:2px;background:var(--primary);border:0"></i><b>12</b></div><div class="sw" style="justify-items:center"><i style="width:var(--space-16);height:var(--space-16);border-radius:2px;background:var(--primary);border:0"></i><b>16</b></div></div></body></html>
