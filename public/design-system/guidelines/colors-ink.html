<!-- @dsCard group="Colors" viewport="700x130" subtitle="Text steps from ink to placeholder" name="Ink & text" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Ink & text</title><link rel="stylesheet" href="../styles.css"><style>body{padding:16px 20px;font-family:var(--font-sans)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sw{display:grid;gap:4px;font-size:11px;color:var(--text-muted)}.sw i{display:block;width:88px;height:52px;border-radius:var(--radius-md);border:1px solid var(--border)}.sw b{font-weight:600;color:var(--text);font-size:11px}.k{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}</style></head><body><div class="row"><div class="sw"><i style="background:var(--ink-900)"></i><b>Text</b><span>--ink-900</span></div><div class="sw"><i style="background:var(--ink-700)"></i><b>Body</b><span>--ink-700</span></div><div class="sw"><i style="background:var(--ink-500)"></i><b>Muted</b><span>--ink-500</span></div><div class="sw"><i style="background:var(--ink-400)"></i><b>Faint</b><span>--ink-400</span></div><div class="sw"><i style="background:var(--ink-300)"></i><b>Placeholder</b><span>--ink-300</span></div></div></body></html>
